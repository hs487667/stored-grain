<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700" role="img" aria-label="Five layers. Entry points (app, validation scripts, experiments) call the pipeline. The pipeline calls the vision models and the three rule modules: physics, measurement and mapping. Vision uses the data catalogue, which uses the mapping vocabulary. The training code is the only part that imports upward, back into the pipeline.">
  <title>stored-grain module dependencies</title>
  <style>
    text { font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .bg { fill: #f3efe3; }
    .band { fill: #ebe5d3; }
    .box { fill: #fffcf4; stroke: rgba(28, 35, 24, 0.30); stroke-width: 1.2; }
    .hub { fill: #fffcf4; stroke: #9a6a00; stroke-width: 2; }
    .trainbox { fill: #e6efe3; stroke: #2f7a45; stroke-width: 1.2; }
    .t { fill: #1c2318; font-family: Consolas, "SF Mono", Menlo, monospace; font-size: 12.5px; font-weight: 600; }
    .s { fill: #59634f; font-size: 11.5px; }
    .bandname { fill: #1c2318; font-size: 15px; font-weight: 700; }
    .bandrole { fill: #59634f; font-size: 11.5px; }
    .lbl { fill: #59634f; font-size: 11.5px; font-style: italic; }
    .lblgold { fill: #9a6a00; font-size: 11.5px; font-weight: 600; }
    .lblember { fill: #b3402a; font-size: 11.5px; font-weight: 600; }
    .flow { stroke: #9a6a00; stroke-width: 2; fill: none; }
    .dep { stroke: #1c2318; stroke-opacity: 0.65; stroke-width: 1.4; fill: none; }
    .exc { stroke: #b3402a; stroke-width: 1.6; stroke-dasharray: 6 4; fill: none; }
  </style>
  <defs>
    <marker id="hd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1c2318" fill-opacity="0.75"/></marker>
    <marker id="hf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9a6a00"/></marker>
    <marker id="he" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b3402a"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="700" rx="14"/>

  <rect class="band" x="20" y="20" width="920" height="96" rx="10"/>
  <rect class="band" x="20" y="156" width="920" height="96" rx="10"/>
  <rect class="band" x="20" y="292" width="920" height="96" rx="10"/>
  <rect class="band" x="20" y="428" width="920" height="96" rx="10"/>
  <rect class="band" x="20" y="580" width="920" height="96" rx="10"/>
  <text class="bandname" x="36" y="52">Entry points</text><text class="bandrole" x="36" y="71">what you run</text>
  <text class="bandname" x="36" y="188">Orchestration</text><text class="bandrole" x="36" y="207">one call per photo</text>
  <text class="bandname" x="36" y="324">Models</text><text class="bandrole" x="36" y="343">the learned parts</text>
  <text class="bandname" x="36" y="460">Dataset catalogue</text><text class="bandrole" x="36" y="479">images and splits</text>
  <text class="bandname" x="36" y="612">Rules</text><text class="bandrole" x="36" y="631">import nothing else</text>

  <rect class="box" x="210" y="38" width="290" height="60" rx="8"/>
  <text class="t" x="226" y="62">app/ · web server + page</text>
  <text class="s" x="226" y="83">1,188 lines · 128 tests</text>
  <rect class="box" x="520" y="38" width="200" height="60" rx="8"/>
  <text class="t" x="536" y="62">validate · calibrate</text>
  <text class="s" x="536" y="83">322 lines · run by hand</text>
  <rect class="box" x="740" y="38" width="180" height="60" rx="8"/>
  <text class="t" x="756" y="62">experiments/</text>
  <text class="s" x="756" y="83">8 scripts · 990 lines</text>

  <rect class="hub" x="210" y="174" width="290" height="60" rx="8"/>
  <text class="t" x="226" y="198">pipeline.py</text>
  <text class="s" x="226" y="219">406 lines · 32 tests · analyse(), rank_lots()</text>

  <rect class="box" x="210" y="310" width="290" height="60" rx="8"/>
  <text class="t" x="226" y="334">vision/ · used by the app</text>
  <text class="s" x="226" y="355">localise · dataset · predict_scene · 471 lines</text>
  <rect class="trainbox" x="520" y="310" width="400" height="60" rx="8"/>
  <text class="t" x="536" y="334">vision/ · training only</text>
  <text class="s" x="536" y="355">6 scripts · 1,526 lines · 39 tests</text>

  <rect class="box" x="660" y="446" width="260" height="60" rx="8"/>
  <text class="t" x="676" y="470">data/manifest.py</text>
  <text class="s" x="676" y="491">301 lines · 14 tests</text>

  <rect class="box" x="210" y="598" width="220" height="60" rx="8"/>
  <text class="t" x="226" y="622">physics/</text>
  <text class="s" x="226" y="643">969 lines · 73 tests</text>
  <rect class="box" x="450" y="598" width="220" height="60" rx="8"/>
  <text class="t" x="466" y="622">measurement/sampling.py</text>
  <text class="s" x="466" y="643">389 lines · 31 tests</text>
  <rect class="box" x="690" y="598" width="230" height="60" rx="8"/>
  <text class="t" x="706" y="622">mapping/classes.py</text>
  <text class="s" x="706" y="643">293 lines · 19 tests</text>

  <line class="flow" x1="355" y1="98" x2="355" y2="172" marker-end="url(#hf)"/>
  <text class="lblgold" x="367" y="140">analyse(), rank_lots()</text>
  <line class="dep" x1="600" y1="98" x2="482" y2="172" marker-end="url(#hd)"/>
  <text class="lbl" x="576" y="132">on synthetic trays</text>

  <line class="flow" x1="355" y1="234" x2="355" y2="308" marker-end="url(#hf)"/>
  <text class="lblgold" x="367" y="276">U-Net · crop transform</text>

  <polyline class="flow" points="210,204 196,204 196,556 805,556"/>
  <line class="flow" x1="320" y1="556" x2="320" y2="596" marker-end="url(#hf)"/>
  <line class="flow" x1="560" y1="556" x2="560" y2="596" marker-end="url(#hf)"/>
  <line class="flow" x1="805" y1="556" x2="805" y2="596" marker-end="url(#hf)"/>
  <text class="lblgold" x="340" y="549">assess()</text>
  <text class="lblgold" x="580" y="549">resolution()</text>
  <text class="lblgold" x="700" y="549">measure()</text>

  <line class="dep" x1="430" y1="370" x2="700" y2="444" marker-end="url(#hd)"/>
  <text class="lbl" x="520" y="428" text-anchor="middle">class list · splits</text>
  <line class="dep" x1="860" y1="370" x2="860" y2="444" marker-end="url(#hd)"/>
  <text class="lbl" x="848" y="412" text-anchor="end">session splits</text>
  <line class="dep" x1="880" y1="506" x2="880" y2="596" marker-end="url(#hd)"/>
  <text class="lbl" x="868" y="540" text-anchor="end">label vocabularies</text>

  <line class="exc" x1="540" y1="310" x2="492" y2="237" marker-end="url(#he)"/>
  <text class="lblember" x="552" y="276">reaches back up: debris rule, predict_scene, decode()</text>
</svg>
